<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Weaver | 回声织机</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.88/epub.min.js"></script>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">Echo Weaver</div>
        <div class="theme-switch" id="themeToggle">🌙</div>
        <nav>
            <div class="nav-item active">全量灵感</div>
        </nav>
        <div class="upload-area">
            <input type="file" id="fileInput" hidden accept=".epub,.txt">
            <button onclick="document.getElementById('fileInput').click()">+ 导入灵感 (EPUB/TXT)</button>
        </div>
    </aside>

    <main class="main-content">
        <input type="text" id="searchBar" placeholder="搜索书名、内容或关键词..." class="search-bar">
        <div class="book-grid" id="bookGrid">
            </div>
    </main>

    <section class="detail-panel" id="detailPanel">
        <div class="empty-state">点选书籍以开启叙事编织</div>
    </section>

    <script src="script.js"></script>
</body>
</html>
